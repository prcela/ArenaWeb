<!doctype html>
<html lang="hr">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<link href="style.css" rel="stylesheet" type="text/css" />
	<title>Yamb - preuzimanje</title>
	<style>
		* {
			box-sizing: border-box;
		}

		html,
		body {
			min-height: 100%;
		}

		body.download-page {
			margin: 0;
			background: #f5f7fb;
			color: #111827;
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
			text-align: left;
		}

		.download-shell {
			align-items: center;
			display: grid;
			min-height: 100vh;
			padding: 32px 18px;
		}

		.download-layout {
			align-items: center;
			display: grid;
			gap: 34px;
			grid-template-columns: minmax(0, 0.95fr) minmax(300px, 1.05fr);
			margin: 0 auto;
			max-width: 880px;
			width: 100%;
		}

		.brand {
			display: grid;
			gap: 18px;
			justify-items: start;
		}

		.app-icon {
			border-radius: 24px;
			box-shadow: 0 18px 40px rgba(17, 24, 39, 0.16);
			height: 112px;
			width: 112px;
		}

		h1 {
			font-size: 44px;
			font-weight: 600;
			letter-spacing: 0;
			line-height: 1;
			margin: 0;
		}

		.lede {
			color: #4b5563;
			font-size: 20px;
			line-height: 1.45;
			margin: 0;
			max-width: 420px;
		}

		.download-options {
			display: grid;
			gap: 12px;
		}

		.store-option {
			align-items: center;
			background: #ffffff;
			border: 1px solid #dde4ee;
			border-radius: 8px;
			color: inherit;
			display: flex;
			gap: 18px;
			justify-content: space-between;
			min-height: 96px;
			padding: 18px;
			text-decoration: none;
			transition: border-color 160ms ease, box-shadow 160ms ease, transform 160ms ease;
		}

		.store-option:hover,
		.store-option:focus {
			border-color: #b7c4d6;
			box-shadow: 0 12px 26px rgba(17, 24, 39, 0.09);
			outline: none;
			transform: translateY(-1px);
		}

		.store-copy {
			display: grid;
			gap: 4px;
		}

		.store-copy strong {
			font-size: 19px;
			font-weight: 600;
			letter-spacing: 0;
			line-height: 1.2;
		}

		.store-copy span {
			color: #64748b;
			font-size: 15px;
			line-height: 1.3;
		}

		.store-badge {
			display: block;
			flex: 0 0 auto;
		}

		.app-store-badge {
			height: 40px;
			width: 120px;
		}

		.google-play-badge {
			height: 52px;
			width: 136px;
		}

		.apk-badge {
			align-items: center;
			background: #111827;
			border-radius: 8px;
			color: #ffffff;
			display: inline-flex;
			flex: 0 0 auto;
			font-size: 18px;
			font-weight: 700;
			height: 44px;
			justify-content: center;
			letter-spacing: 0;
			min-width: 120px;
			padding: 0 18px;
		}

		.support-links {
			display: flex;
			flex-wrap: wrap;
			gap: 14px;
			margin-top: 8px;
		}

		.support-links a {
			color: #304155;
			font-size: 15px;
			text-decoration: underline;
			text-underline-offset: 3px;
		}

		@media (max-width: 720px) {
			.download-shell {
				align-items: start;
				padding: 28px 16px;
			}

			.download-layout {
				gap: 28px;
				grid-template-columns: 1fr;
			}

			h1 {
				font-size: 38px;
			}

			.lede {
				font-size: 18px;
			}
		}

		@media (max-width: 480px) {
			.store-option {
				align-items: flex-start;
				flex-direction: column;
			}

			.google-play-badge {
				height: auto;
				width: 136px;
			}
		}
	</style>
</head>

<body class="download-page">
	<main class="download-shell">
		<div class="download-layout">
			<section class="brand" aria-labelledby="download-title">
				<img class="app-icon" src="die.png" alt="Yamb" width="112" height="112" />
				<h1 id="download-title">Preuzmi Yamb</h1>
				<p class="lede">Igraj Yamb na iPhoneu, iPadu ili Android uređaju. Odaberi trgovinu ili direktni APK za svoj uređaj.</p>
				<nav class="support-links" aria-label="Dodatni linkovi">
					<a href="index_hr.html">O igri</a>
					<a href="rules/index_hr.html">Pravila</a>
					<a href="mailto:yamb.igre@gmail.com">Kontakt</a>
				</nav>
			</section>

			<section class="download-options" aria-label="Opcije preuzimanja">
				<a class="store-option" href="https://apps.apple.com/hr/app/yamb/id354188615?mt=8">
					<span class="store-copy">
						<strong>App Store</strong>
						<span>Za iPhone i iPad</span>
					</span>
					<img class="store-badge app-store-badge" src="appstore.svg" alt="Download on the App Store" width="120" height="40" />
				</a>

				<a class="store-option" href="https://play.google.com/store/apps/details?id=app.igre.yamb">
					<span class="store-copy">
						<strong>Google Play</strong>
						<span>Za Android uređaje s Google Play uslugama</span>
					</span>
					<img class="store-badge google-play-badge" src="android.png" alt="Get it on Google Play" width="136" height="52" />
				</a>

				<a class="store-option" href="app-release.apk" download>
					<span class="store-copy">
						<strong>Direktni APK</strong>
						<span>Za Android uređaje bez Google Playa</span>
					</span>
					<span class="apk-badge">APK</span>
				</a>
			</section>
		</div>
	</main>
</body>
</html>
